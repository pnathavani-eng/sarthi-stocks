name: BSE Test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: BSE announcements test
        run: |
          D=$(date +%Y%m%d)
          P=$(date -d '3 days ago' +%Y%m%d)
          curl -s -m 30 -o out.json -w "HTTP %{http_code}\n" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36" \
            -H "Referer: https://www.bseindia.com/" \
            -H "Origin: https://www.bseindia.com" \
            "https://api.bseindia.com/BseIndiaAPI/api/AnnSubCategoryGetData/w?pageno=1&strCat=-1&strPrevDate=$P&strScrip=&strSearch=P&strToDate=$D&strType=C"
          head -c 600 out.json
